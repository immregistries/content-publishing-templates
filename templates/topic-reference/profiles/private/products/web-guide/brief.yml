id: web-guide
status: draft
core_release: null

product:
  type: web page
  format: self-contained HTML, built locally and optionally hosted in InteropHub
  length: the complete core document
  presentation_time: null
  template: process/templates/guide (AIRA Web theme)

audience:
  name: People who may see InteropHub topic {{TOPIC}}
  assumed_knowledge: []

purpose: >-
  Build the Topic Reference for internal review: one readable copy of where
  the topic currently stands, to refer to in discussions, with a way to
  comment on it during and between meetings.

desired_outcome: >-
  Readers can find any section quickly, see the document's status and version,
  and leave comments that are brought back to this repository as review inputs.

emphasize:
  - The status and version
  - A route back to InteropHub topic {{TOPIC}}

exclude_or_deemphasize:
  - Repository build and maintenance detail

tone:
  - Plain language

allowed_sources:
  - ../../content/

required_elements:
  - Status tag and version on the page
  - Return link to InteropHub topic {{TOPIC}}
  - Comments that stay in the reader's browser until downloaded
  - The internal-use notice in the page footer

published_locations:
  interophub: When guide.json hosting is interophub, versioned access-controlled URLs

assumptions:
  - guide.json hosting says whether the guide stays local or is hosted in InteropHub.
  - GitHub Pages is not used because a Pages site may be publicly readable.
delivery_context: []
requested_by: null
requested_date: null
needed_by: null
