# Primary infographic: this topic at a glance.
#
# Canonical source, reviewed like the Markdown in content/. Each label condenses
# a section of the core document and names it with ref, a heading ID or anchor
# in content/. Add no claim, number, commitment, or change in certainty that the
# referenced section does not state. Replace each CONFIRM text as the sections
# are written. build.ps1 draws the image and places it in the guide and the Word
# document. See "Primary infographic" in process/guidance/TopicReference.md.
layout: topic-at-a-glance
arrangement: set
title: "{{TOPIC_NAME}}"
purpose:
  text: "CONFIRM: State in one sentence what this topic is for."
  ref: purpose
ideas:
  - id: covers
    label: "CONFIRM: First key idea"
    text: "CONFIRM: Condense the section it names in a sentence."
    ref: what-this-project-covers
  - id: related
    label: "CONFIRM: Second key idea"
    text: "CONFIRM: Condense the section it names in a sentence."
    ref: related-work
  - id: decisions
    label: "CONFIRM: Third key idea"
    text: "CONFIRM: Condense the section it names in a sentence."
    ref: working-decisions
relationships:
  - from: covers
    to: related
    label: "CONFIRM: relation"
    ref: related-topics
alt: "CONFIRM: Describe the figure in one or two sentences for readers who cannot see it."
topic_link: {{INFOGRAPHIC_TOPIC_LINK}}
