project:
  type: default
  output-dir: output
  render:
    - {{ASSEMBLY}}.qmd

# Images in content/ are linked relative to their Markdown file.
resource-path:
  - .
  - content

format:
  docx:
    toc: true
    reference-doc: process/templates/word/aira-reference-document.docx
  html:
    toc: true
    embed-resources: true

